server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location = /api/auth/validate {
        internal;
        proxy_pass http://auth-service:8086/api/auth/validate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    location /api/auth {
        proxy_pass http://auth-service:8086;
    }

    location /api/products {
        proxy_pass http://catalog-service:8081;
    }
    
    location /api/inventory {
        auth_request /api/auth/validate;
        proxy_pass http://inventory-service:8082;
    }
    
    location /api/orders {
        auth_request /api/auth/validate;
        auth_request_set $user_id $upstream_http_x_user_id;
        auth_request_set $user_role $upstream_http_x_user_role;
        proxy_set_header X-User-Id $user_id;
        proxy_set_header X-User-Role $user_role;
        proxy_pass http://order-service:8083;
    }
    
    location /api/payment {
        auth_request /api/auth/validate;
        proxy_pass http://payment-service:8084;
    }
    
    location /api/notifications {
        auth_request /api/auth/validate;
        proxy_pass http://notification-service:8085;
    }
}
