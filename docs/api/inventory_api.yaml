openapi: 3.0.3
info:
  title: Inventory Service API
  version: 1.0.0
  description: API for checking stock levels. Reservation is handled via messaging.
paths:
  /api/inventory:
    get:
      summary: Get all stock levels
      responses:
        '200':
          description: A list of inventory items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryItem'
  /api/inventory/{productId}:
    get:
      summary: Get stock level for a product
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Inventory details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItem'
        '404':
          description: Not Found
    post:
      summary: Add stock for a product
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity:
                  type: integer
      responses:
        '200':
          description: Stock updated

components:
  schemas:
    InventoryItem:
      type: object
      properties:
        productId:
          type: string
          format: uuid
        availableQuantity:
          type: integer
        reservedQuantity:
          type: integer
